---
# =============================================================================
# satellite_register_hosts.yml
# ---------------------------------------------------------------------------
# Registers hosts with Red Hat Satellite using the redhat.satellite
# collection.  Automatically resolves the correct activation key per host
# via a hierarchical fallback chain built from Ansible facts.
#
# Fallback chain (first match wins):
#   1. {distro}_{major}.{minor}_{arch}   e.g. RedHat_9.4_x86_64
#   2. {distro}_{major}_{arch}           e.g. RedHat_9_x86_64
#   3. {distro}_{major}                  e.g. RedHat_9
#   4. {family}_{major}.{minor}_{arch}   (alias: CentOS → RedHat)
#   5. {family}_{major}_{arch}           (alias)
#   6. {family}_{major}                  (alias)
#   7. "default"                         catch-all
#
# Supports RHEL, CentOS, CentOS Stream, Rocky, Alma, and Oracle Linux
# out of the box via the distro-family alias map.
#
# Designed for AAP 2.7 Job Templates.
#
# AAP Job Template setup:
#   Credential types:
#     1. "Red Hat Satellite 6"  → injects SATELLITE_SERVER_URL, _USERNAME,
#        _PASSWORD, _VALIDATE_CERTS as env vars (consumed by module_defaults).
#     2. "Machine"              → SSH access to target hosts.
#   Inventory:  static or Satellite dynamic inventory.
#   Limit:      the hosts / groups you want to register.
# =============================================================================


# ---- Play 1: Gather facts from every target ---------------------------------
- name: Gather OS facts from target hosts
  hosts: all
  gather_facts: true
  tasks: []


# ---- Play 2: Resolve keys & generate registration commands -------------------
- name: Resolve activation keys and generate registration commands
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    redhat.satellite.registration_command:
      server_url:     "{{ satellite_server_url  | default(lookup('env', 'SATELLITE_SERVER_URL'))  | default(omit, boolean=true) }}"
      username:       "{{ satellite_username    | default(lookup('env', 'SATELLITE_USERNAME'))    | default(omit, boolean=true) }}"
      password:       "{{ satellite_password    | default(lookup('env', 'SATELLITE_PASSWORD'))    | default(omit, boolean=true) }}"
      validate_certs: "{{ satellite_validate_certs | default(lookup('env', 'SATELLITE_VALIDATE_CERTS')) | default(true, boolean=true) }}"

  tasks:

    # ------------------------------------------------------------------
    # Step 1: Build a per-host activation key resolution
    # ------------------------------------------------------------------
    # For each host, compute the fallback chain and find the first match.
    # Result: a dict  { hostname: { ak_list: [...], matched_rule: "...", ... } }
    # ------------------------------------------------------------------
    - name: Resolve activation key for each host
      ansible.builtin.set_fact:
        _host_ak_map: >-
          {%- set result = {} -%}
          {%- set ak_map = satellite_activation_key_map -%}
          {%- set family_map = satellite_distro_family_map | default({}) -%}
          {%- for host in groups['all'] -%}
            {%- set hv = hostvars[host] -%}
            {%- if hv.ansible_distribution is defined -%}
              {%- set distro = hv.ansible_distribution | regex_replace(' ', '') -%}
              {%- set major  = hv.ansible_distribution_major_version | default('') -%}
              {%- set minor  = hv.ansible_distribution_version | default('') -%}
              {%- set arch   = hv.ansible_architecture | default('x86_64') -%}
              {%- set family = family_map.get(distro, distro) -%}
              {#- Build the fallback chain, most-specific first -#}
              {%- set candidates = [
                    distro ~ '_' ~ minor ~ '_' ~ arch,
                    distro ~ '_' ~ major ~ '_' ~ arch,
                    distro ~ '_' ~ major,
                    family ~ '_' ~ minor ~ '_' ~ arch,
                    family ~ '_' ~ major ~ '_' ~ arch,
                    family ~ '_' ~ major,
                    'default'
                  ] -%}
              {%- set ns = namespace(matched='none', ak_list=[]) -%}
              {%- for candidate in candidates -%}
                {%- if ns.matched == 'none' and candidate in ak_map -%}
                  {%- set ns.matched = candidate -%}
                  {%- set ns.ak_list = ak_map[candidate] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set _ = result.update({
                    host: {
                      'distro': distro,
                      'major': major,
                      'minor': minor,
                      'arch': arch,
                      'family': family,
                      'candidates': candidates,
                      'matched_rule': ns.matched,
                      'ak_list': ns.ak_list
                    }
                  }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    - name: Display activation key resolution for every host
      ansible.builtin.debug:
        msg: >-
          {{ item }}:
          distro={{ _host_ak_map[item].distro }}
          version={{ _host_ak_map[item].minor }}
          arch={{ _host_ak_map[item].arch }}
          → rule="{{ _host_ak_map[item].matched_rule }}"
          → keys={{ _host_ak_map[item].ak_list }}
      loop: "{{ groups['all'] }}"

    # ------------------------------------------------------------------
    # Step 2: Validate every host got a match
    # ------------------------------------------------------------------
    - name: Verify every host resolved to an activation key
      ansible.builtin.assert:
        that:
          - _host_ak_map[item].matched_rule != 'none'
        fail_msg: >-
          No activation key found for {{ item }}
          ({{ _host_ak_map[item].distro }} {{ _host_ak_map[item].minor }} {{ _host_ak_map[item].arch }}).
          Candidates tried: {{ _host_ak_map[item].candidates }}.
          Add an entry to satellite_activation_key_map in group_vars/all/satellite.yml.
        quiet: true
      loop: "{{ groups['all'] }}"

    # ------------------------------------------------------------------
    # Step 3: (Optional) API-validate that keys exist in Satellite
    # ------------------------------------------------------------------
    - name: Validate activation keys exist in Satellite
      redhat.satellite.resource_info:
        resource: activation_keys
        search: "name = \"{{ item }}\""
        organization: "{{ satellite_organization }}"
      register: _ak_check
      loop: >-
        {{
          _host_ak_map.values()
          | map(attribute='ak_list')
          | flatten
          | unique
          | list
        }}
      when: satellite_validate_activation_keys | default(false) | bool

    - name: Fail if any activation key does not exist in Satellite
      ansible.builtin.assert:
        that:
          - item.resources | length > 0
        fail_msg: >-
          Activation key "{{ item.item }}" was not found in Satellite
          organization "{{ satellite_organization }}".
        quiet: true
      loop: "{{ _ak_check.results | default([]) }}"
      when: satellite_validate_activation_keys | default(false) | bool

    # ------------------------------------------------------------------
    # Step 4: Deduplicate and generate one command per unique key-set
    # ------------------------------------------------------------------
    - name: Build unique activation key sets
      ansible.builtin.set_fact:
        _unique_key_sets: >-
          {{
            _host_ak_map.values()
            | map(attribute='ak_list')
            | map('sort')
            | map('join', ',')
            | unique
            | list
          }}

    - name: Show how many registration commands will be generated
      ansible.builtin.debug:
        msg: >-
          {{ _unique_key_sets | length }} unique key set(s) found across
          {{ groups['all'] | length }} host(s): {{ _unique_key_sets }}

    - name: Generate registration command per unique key set
      redhat.satellite.registration_command:
        organization:                  "{{ satellite_organization | default(omit) }}"
        location:                      "{{ satellite_location     | default(omit) }}"
        hostgroup:                     "{{ satellite_hostgroup    | default(omit, boolean=true) }}"
        activation_keys:               "{{ item.split(',') }}"
        smart_proxy:                   "{{ satellite_smart_proxy | default(omit, boolean=true) }}"
        force:                         "{{ satellite_force_registration }}"
        ignore_subman_errors:          "{{ satellite_ignore_subman_errors }}"
        insecure:                      "{{ satellite_insecure_curl }}"
        jwt_expiration:                "{{ satellite_jwt_expiration }}"
        setup_insights:                "{{ satellite_setup_insights }}"
        setup_remote_execution:        "{{ satellite_setup_remote_execution }}"
        setup_remote_execution_pull:   "{{ satellite_setup_remote_execution_pull }}"
        setup_container_registry_certs: "{{ satellite_setup_container_registry_certs }}"
        update_packages:               "{{ satellite_update_packages }}"
        packages:                      "{{ satellite_packages | default(omit, boolean=true) }}"
      loop: "{{ _unique_key_sets }}"
      register: _reg_commands

    # Build lookup:  { "AK-RHEL9": "curl …", "AK-RHEL8": "curl …" }
    - name: Build command lookup by key set
      ansible.builtin.set_fact:
        _reg_cmd_by_keyset: >-
          {{
            dict(
              _reg_commands.results
              | map(attribute='item')
              | zip(
                  _reg_commands.results
                  | map(attribute='registration_command')
                )
            )
          }}


# ---- Play 3: Execute the right command on each host --------------------------
- name: Register hosts with Satellite
  hosts: all
  become: true
  gather_facts: false          # already gathered in Play 1

  vars:
    # Look up this host's resolved key set, then find its command.
    _my_ak_info: "{{ hostvars['localhost']['_host_ak_map'][inventory_hostname] }}"
    _my_keyset:  "{{ _my_ak_info.ak_list | sort | join(',') }}"
    _my_reg_cmd: "{{ hostvars['localhost']['_reg_cmd_by_keyset'][_my_keyset] }}"

  tasks:
    - name: Show resolved activation key for this host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ _my_ak_info.distro }} {{ _my_ak_info.minor }}
          ({{ _my_ak_info.arch }})
          → rule "{{ _my_ak_info.matched_rule }}"
          → keys {{ _my_ak_info.ak_list }}

    - name: Check current subscription status
      ansible.builtin.command:
        cmd: subscription-manager identity
      register: _sub_identity
      changed_when: false
      failed_when: false

    - name: Run registration command
      ansible.builtin.shell:
        cmd: "{{ _my_reg_cmd }}"
      register: _reg_result
      when: >-
        satellite_force_registration | bool
        or _sub_identity.rc | default(1) != 0
      changed_when: _reg_result.rc == 0

    - name: Display registration output
      ansible.builtin.debug:
        var: _reg_result.stdout_lines
      when: _reg_result is changed
