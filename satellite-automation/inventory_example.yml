---
# =============================================================================
# Example Inventory
# ---------------------------------------------------------------------------
# Strategy B (fact-based map) does NOT require OS groups — you can put
# every host under [all] and the playbook detects the OS from facts.
#
# Strategy A (group-based) requires these groups so group_vars kick in.
# You can use BOTH — the groups give you per-OS variable overrides,
# and the fact-based map is the fallback.
#
# In AAP 2.7, you would typically use a Satellite dynamic inventory or
# a smart inventory with host filters instead of a static file.
# =============================================================================

all:
  children:
    rhel9:
      hosts:
        web01.example.com:
        web02.example.com:
        app01.example.com:
    rhel8:
      hosts:
        db01.example.com:
        legacy-app.example.com:
    rhel7:
      hosts:
        old-server.example.com:
